<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Qubool</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fbf8f2; color: #2b2620;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font: 400 32px/1.2 Georgia, serif; margin: 20px 0 8px; }
    p { margin: 0 auto 24px; max-width: 280px; color: #6f665c; }
    button { border: 0; border-radius: 999px; background: #2b2620; color: #fbf8f2; font: inherit; padding: 12px 28px; }
  </style>
</head>
<body>
  <main>
    <svg width="64" height="64" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="12.5" cy="16" r="6.5" fill="none" stroke="#2b2620" stroke-width="2.2" />
      <circle cx="19.5" cy="16" r="6.5" fill="none" stroke="#c9a46a" stroke-width="2.2" />
    </svg>
    <h1>You're offline</h1>
    <p>Qubool needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
  </main>
</body>
</html>
